name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts

      - name: Check the mod does not require a newer NeoForge than the pack runs
        run: python3 scripts/check_neoforge_floor.py

      - name: Build and test
        run: ./gradlew build --no-daemon

      # Gradle reports BUILD SUCCESSFUL even when the GameTest server fails to start or ran zero
      # tests, so a green exit code alone proves nothing (MINECRAFT-499 review: this is the
      # standalone-load/runtime acceptance evidence for placement/stacking/drops/collision and the
      # legacy dynamicterrain registry-name compatibility contract). check_gametest_count.py fails
      # closed unless every named test below actually ran and passed.
      - name: Run GameTests
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          python3 scripts/check_gametest_count.py gametest.log

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: layered-slopes
          path: build/libs/*.jar
          if-no-files-found: error

  release-gate:
    uses: brooswit-factory/release-gate/.github/workflows/gate.yml@v1
    with:
      gated-paths: '["^src/"]'
      version-file: 'gradle.properties'

  # MINECRAFT-499 / Wroosbit gap 1 (John's 18:58 direction): reuses Dynamic Vehicles'
  # tools/client-smoke/acceptance.py pattern -- a real disposable server + real disposable client
  # (headless via Xvfb), proving the client actually classloads Layered Slopes and that
  # ClientEvents' grass-tint color handler fires a real biome color at render time, not just that
  # the server compiles/boots.
  client-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install virtual display and software GL
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth imagemagick libgl1-mesa-dri libopenal1
      - name: Compile test-only client harness
        run: ./gradlew classes -PclientAcceptance --no-daemon -Dorg.gradle.jvmargs=-Xmx1G
      - name: Run disposable local server and real client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/client-smoke/acceptance.py
      - name: Preserve client acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-acceptance
          path: |
            client-acceptance-*.log
            run-acceptance-client/client-acceptance-*.json
            run-acceptance-client/client-acceptance-failure.txt
            run-acceptance-client/logs/latest.log
            run-acceptance-client/crash-reports/
            run-acceptance-server/logs/latest.log
          if-no-files-found: warn
